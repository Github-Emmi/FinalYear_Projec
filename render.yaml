# render.yaml — Infrastructure as Code for Render.com
# Defines the full four-service cluster: PostgreSQL, Redis/KeyValue, Web API, Celery Worker.
#
# Deploy: connect this repo to Render → "New Blueprint Instance" → select render.yaml
# All service-to-service URLs (DB, Redis) are wired automatically via fromDatabase/fromService.

services:
  # ── 1. FastAPI Web Service (API + WebSocket gateway) ─────────────────────────
  - type: web
    name: lms-api
    runtime: docker
    dockerfilePath: backend/docker/Dockerfile.prod
    dockerContext: backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: RELOAD
        value: "false"

      # Wired automatically from managed services below
      - key: DATABASE_URL
        fromDatabase:
          name: lms-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lms-cache
          property: connectionString

      # Celery: Redis dual-role as broker + result backend on Render
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: lms-cache
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: lms-cache
          property: connectionString

      # Secrets
      - key: SECRET_KEY
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false

  # ── 2. Render Key Value (Redis) — Celery broker + result backend + cache ──────
  # Key Value instances are defined in services:, not a separate redis: root section.
  - type: keyvalue
    name: lms-cache
    plan: free
    # ipAllowList is required for Key Value; [] = internal Render network only
    ipAllowList: []

  # ── 3. Celery Background Worker ──────────────────────────────────────────────
  # Background workers cannot use plan: free — minimum is starter.
  - type: worker
    name: lms-worker
    runtime: docker
    dockerfilePath: backend/docker/Dockerfile.prod
    dockerContext: backend
    dockerCommand: celery -A app.tasks.celery_app worker --loglevel=info -Q grading,email,notifications,celery
    plan: starter
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: lms-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: lms-cache
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: lms-cache
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: lms-cache
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: lms-api
          envVarKey: SECRET_KEY
      - key: OPENROUTER_API_KEY
        fromService:
          type: web
          name: lms-api
          envVarKey: OPENROUTER_API_KEY

# ── Managed PostgreSQL ─────────────────────────────────────────────────────────
databases:
  - name: lms-db
    databaseName: school_management
    plan: free

