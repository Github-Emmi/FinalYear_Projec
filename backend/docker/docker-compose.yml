# Development docker-compose — all 6 services
# Usage (from backend/ directory):
#   docker compose -f docker/docker-compose.yml up -d

version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: school_ms_app
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: school_user
      DB_PASSWORD: school_password
      DB_NAME: school_management
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      # Explicit broker URLs mirror the production env var names so switching
      # broker on Render requires only an env var change, not a code change.
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: dev-secret-key-change-in-production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - school_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: school_ms_worker
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: school_user
      DB_PASSWORD: school_password
      DB_NAME: school_management
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECRET_KEY: dev-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - school_network
    restart: unless-stopped
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "-Q", "grading,email,notifications,celery"]

  postgres:
    image: postgres:15-alpine
    container_name: school_ms_postgres
    environment:
      POSTGRES_USER: school_user
      POSTGRES_PASSWORD: school_password
      POSTGRES_DB: school_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_user -d school_management"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school_network

  redis:
    image: redis:7-alpine
    container_name: school_ms_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school_network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: school_ms_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school_network

  adminer:
    image: adminer:4.8.1
    container_name: school_ms_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - school_network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: school_ms_redis_commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - school_network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  school_network:
    driver: bridge
