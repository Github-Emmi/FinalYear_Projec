# Production docker-compose — minimal footprint (no Adminer/Redis Commander)
# Usage (from backend/ directory):
#   docker compose -f docker/docker-compose.prod.yml up -d
#
# NOTE: Provide secrets via environment or a non-committed .env file.

version: "3.8"

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    container_name: school_ms_app_prod
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      RELOAD: "false"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-school_user}
      DB_PASSWORD: ${DB_PASSWORD:-school_password}
      DB_NAME: ${DB_NAME:-school_management}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      SECRET_KEY: ${SECRET_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - school_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.prod
    container_name: school_ms_worker_prod
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      RELOAD: "false"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-school_user}
      DB_PASSWORD: ${DB_PASSWORD:-school_password}
      DB_NAME: ${DB_NAME:-school_management}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - school_network
    restart: unless-stopped
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "-Q", "grading,email,notifications,celery"]

  postgres:
    image: postgres:15-alpine
    container_name: school_ms_postgres_prod
    environment:
      POSTGRES_USER: ${DB_USER:-school_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-school_password}
      POSTGRES_DB: ${DB_NAME:-school_management}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-school_user} -d ${DB_NAME:-school_management}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school_network

  redis:
    image: redis:7-alpine
    container_name: school_ms_redis_prod
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school_network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: school_ms_rabbitmq_prod
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - school_network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  school_network:
    driver: bridge

